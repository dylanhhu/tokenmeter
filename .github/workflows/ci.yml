name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint, test
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Install linters
        run: brew install swiftformat swiftlint

      - name: Format check
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build and bundle (release)
        run: make bundle

      - name: Verify bundle
        run: |
          test -x build/TokenMeter.app/Contents/MacOS/TokenMeter
          plutil -lint build/TokenMeter.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" build/TokenMeter.app/Contents/Info.plist
          codesign --verify --strict build/TokenMeter.app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: TokenMeter-app
          path: build/TokenMeter.app
          if-no-files-found: error
