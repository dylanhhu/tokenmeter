# SwiftLint configuration — https://github.com/realm/SwiftLint
# Run `make lint` to check locally; CI runs the same command with --strict.

included:
  - Sources
  - Tests

excluded:
  - .build
  - build

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 140
  error: 200
  ignores_comments: true

type_body_length:
  warning: 400
  error: 550

file_length:
  warning: 500
  error: 700

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 20
  error: 30

nesting:
  type_level: 2
  function_level: 3

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

# Long, descriptive names are appropriate for a domain model with many
# near-synonyms (spend, amount, total, credit).
type_name:
  max_length:
    warning: 50
    error: 60

# Force-unwrapping and try! are forbidden in sources but acceptable in tests,
# where a crash is the clearest failure signal.
force_try: error
force_cast: error

custom_rules:
  no_interpolated_secrets_in_logs:
    name: "Secret interpolated into a log message"
    regex: 'Log\.[a-zA-Z]+\.(?:debug|info|notice|warning|error)\([^)]*\\\([^)]*\b(?:apiKey|api_key|secret|token|credential|password)\b'
    message: "Do not interpolate credentials into log messages; use SecretRedactor or omit the value."
    severity: error

  no_print:
    name: "No print statements"
    regex: '^\s*print\('
    message: "Use Log.<category> instead of print."
    severity: error

reporter: "xcode"

# Owned by SwiftFormat instead, to avoid the two tools fighting:
#   trailingCommas, modifierOrder
disabled_rules:
  - trailing_comma
  - modifier_order
